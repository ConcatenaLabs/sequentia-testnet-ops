# The box's journal: every service that logs to it (arcad, arca-signer, arca-ln,
# the watchtowers, the DEX units) is rotated and vacuumed by journald itself.
# Its default cap is 4 GB, about five days of this box's logs; 24 GB keeps about
# a month, the reach an operator's log needs to answer for a round or an exit.
[Journal]
SystemMaxUse=24G
