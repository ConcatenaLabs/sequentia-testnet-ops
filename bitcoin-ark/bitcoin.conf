# Bitcoin Core for the Bitcoin ark. Bark's server needs Bitcoin Core 31 or
# later (it reads the chunk fee rates of getmempoolentry), a transaction
# index, and a mempool that relays packages, for the round and exit
# transactions it fee-bumps through their anchors. The box's own testnet4
# node is older, so the ark has this node of its own beside it.
# Installed as @ETC@/bitcoin.conf by the install script, which fills in the
# @...@ values.
chain=@NETWORK@

[@NETWORK@]
server=1
txindex=1
disablewallet=1
# Outbound peers only: it relays the ark's transactions, it serves no one.
listen=0
# The box's own node first, for a fast first sync.
addnode=@PEER@
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=@BTC_RPC_PORT@
# The Lightning node and the fee proxy read the cookie, which is readable by
# the service user's group. Bark's server and watchman log in as "ark": they
# read their credentials once, and the cookie changes at every start. Only the
# login's salted hash is here; its password is @ETC@/rpc.password (mode 600).
rpccookieperms=group
rpcauth=@RPCAUTH@
debuglogfile=@LOG@/bitcoind.log
shrinkdebugfile=0
dbcache=1000
