# Bark's watchman (watchmand) for the Bitcoin ark: it answers exits and
# sweeps expired rounds back to the server's wallet. Installed as
# @ETC@/watchmand.toml by the install script, which fills in the @...@
# values. It shares captaind's database and its key (the install script
# copies the mnemonic into its data directory).

data_dir = "@LIB@/watchmand"
network = "@NETWORK@"
sync_manager_block_poll_interval = "1s"
htlc_settlement_poll_interval = "60s"
min_trusted_confs = 2
otel_deployment_name = "sequentia-testnet-@NETWORK@-watchman"
# Swept funds go back to captaind's rounds wallet.
sweep_address = "@SWEEP_ADDRESS@"

[watchman]
# Well inside vtxo_exit_delta (72 blocks): a contested exit is answered
# within a minute of the block that needs it.
reaction_interval = "1m"
sweep_interval = "2h"
progress_grace_period = 2
claim_chunksize = 20
incremental_relay_fee = "100 sat/kvb"
min_cpfp_amount = "10000 sat"

# The estimates come from the fee proxy above. These fallbacks are for an
# answer with no estimate in it, and are the proxy's floor.
[fee_estimator]
update_interval = "1m"
history_duration = "60m"
fallback_fee_rate_fast = "30sat/vb"
fallback_fee_rate_regular = "30sat/vb"
fallback_fee_rate_slow = "30sat/vb"
max_fee_rate = "100sat/vb"

[postgres]
host = "@PG_HOST@"
port = @PG_PORT@
name = "@PG_DB@"
user = "@PG_USER@"
max_connections = 5

# The node through its fee proxy (bitcoin-ark/fee-proxy.py,
# bitcoin-ark-feeproxy.service): every call passes through unchanged, except
# that estimatesmartfee is raised to the live mempool's going rate, never
# under 30 sat/vB. testnet4's own estimate, read from its often empty blocks,
# says a sat or two while its public mempool queues at tens.
[bitcoind]
url = "http://127.0.0.1:@FEE_RPC_PORT@"
cookie = "@LIB@/bitcoind/@NETWORK@/.cookie"
