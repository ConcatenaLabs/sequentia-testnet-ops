# PostgreSQL settings for the Arca operator's database. Installed as
# /etc/postgresql/16/main/conf.d/arca.conf; the cluster serves Arca alone.
#
# The database must never lose a commit (arca server/README.md, "Keeping the
# database"): durability on, and every commit flushed by the WAL receiver
# (arca-pg-wal.service, pg_receivewal --synchronous) into
# /var/backups/arca-pg/wal before the commit returns. While that receiver is
# down, commits wait for it rather than go unrecorded.

listen_addresses = 'localhost'
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
synchronous_standby_names = 'arca_wal'
