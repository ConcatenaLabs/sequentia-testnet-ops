# Emissio's own-Bitcoin-node task reads the box Bitcoin node's peer list
# (btc-peers.timer) and the shared Bitcoin endpoint's record of each
# address's last call (seq-rpc-proxy, answered to the box only). Paths and
# a local URL only: no secret belongs in an Environment= line.
[Service]
Environment=EMISSIO_BTC_PEERS=/var/lib/btc-peers/peers.json
Environment=EMISSIO_ANCHOR_SEEN=http://127.0.0.1:48400/last-seen
