# The covenant settler takes covenant fills for the book. This box also runs the committee's nodes,
# so a runaway is killed here, not by the kernel machine-wide.
# Sized from its measured peak, 20 MB: 512 MB is more than twenty times that.
# Restart=always brings it back.
# No MemoryHigh: past it the kernel throttles instead of killing.
[Service]
MemoryMax=512M
MemorySwapMax=0
