# The shared Bitcoin testnet4 endpoint (seq-rpc-proxy.service, port 48400)
# runs from a checkout of its own, /root/sequentia/rpc-proxy: a sparse
# checkout of the Sequentia repository holding contrib/sequentia only. A
# change to the proxy then goes live without moving the nodes' run checkout
# (/root/Sequentia), which moves only at a node cutover.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /root/sequentia/rpc-proxy/contrib/sequentia/testnet-rpc-cache-proxy.py
