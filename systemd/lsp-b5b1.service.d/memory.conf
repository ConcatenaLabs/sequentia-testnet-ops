# The web wallet's backend runs seqob-cli for each swap it takes (xlift, xpln, xsubas and the rest),
# in its own control group; its hosted Lightning nodes run in seqln-hosted.slice and are not
# counted here. This box also runs the committee's nodes, so a runaway is killed here, not by the
# kernel machine-wide.
# It is the public web wallet's backend, so a kill is an outage people see: the limit is there only
# so that a runaway cannot take the host. Its largest peak over the 44 runs the journal holds (eight
# days) was 86.8 MB; 2 GB is more than twenty times that.
# Past it the kernel kills the largest process in the group, usually a swap's seqob-cli.
# OOMPolicy=continue keeps the backend and its other swaps running (systemd's default stops the
# whole unit when any process in it is killed for memory). If the backend itself is the one killed,
# Restart=always brings it back within seconds; the hosted nodes keep running.
# No MemoryHigh: past it the kernel throttles instead of killing.
[Service]
MemoryMax=2G
MemorySwapMax=0
OOMPolicy=continue
