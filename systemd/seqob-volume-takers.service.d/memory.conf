# The volume takers run each trade as a process of their own (seqob-crosser -take, which runs
# seqob-cli) inside this unit's 2 GB limit (MemoryMax in the unit). When one of them passes the limit
# the kernel kills it, and systemd's default would then stop the whole unit, ending every trade in
# flight and the ramp with them. OOMPolicy=continue keeps the unit running and the killed trade is
# recorded as failed, as any other failure is.
[Service]
OOMPolicy=continue
