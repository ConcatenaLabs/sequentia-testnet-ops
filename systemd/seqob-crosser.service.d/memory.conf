# The order crosser runs its legs as child processes in its own control group (seqob-cli lift and
# covfill, the cross-chain drivers), at most one crossing per market at a time. This box also runs
# the committee's nodes, so a runaway leg must be killed here and not by the kernel machine-wide,
# which is what happened when a lift's coin selection grew to 35 GB (seqdex #198).
# Sized from the fixed seqob-cli's measured peaks: a lift holds 25 MB with 29 coins at the taker's
# address, 45 MB with 1,000 and 465 MB with 10,000; the crosser itself about 16 MB. 2 GB is room for
# a lift in every market at once at a thousand coins, or four at ten thousand. Past it the kernel
# kills the largest process in the group, the leg, which the crosser reports as failed; if it is the
# crosser itself, Restart=on-failure brings it back.
# No MemoryHigh: past it the kernel throttles instead of killing, and a throttled leg holds its swap
# open until it expires.
[Service]
MemoryMax=2G
MemorySwapMax=0
