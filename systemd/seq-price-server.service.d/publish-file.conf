# The network's price server also publishes its fee whitelist as a file, for the
# nodes connected to it (every testnet node by default): Caddy serves the file at
# http://sequentiatestnet.com/feewhitelist. The code runs from its own detached
# checkout of the node repository, /root/seq-price-server-src, which
# bin/publish-fee-whitelist.sh installs and moves forward, never back. The
# box-local config, which holds the node RPC credentials, stays where it was.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /root/seq-price-server-src/contrib/price-server/price_server.py --config /root/price-demo/config.json --publish-file /srv/feewhitelist/feewhitelist.json
