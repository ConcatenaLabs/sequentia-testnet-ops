# The DEX wallet daemon (Ocean, seqdex-wallet.service) shares the box with the committee's
# nodes, the Arca operator and the makers. These limits keep a runaway from taking the box: it
# is slowed at 14 GB, killed and restarted at 18 GB, never pushed into swap, and held to two
# cores at half the default CPU weight. Each of its ~80 accounts scans the chain on its own, so
# a catch-up after a restart took six cores and the box's load to 20 for an hour; at two cores
# it takes longer and the nodes, the Arca operator and the makers keep their share. Ocean's scan of its accounts after a start was measured above 6.5 GB, and above
# MemoryHigh the kernel throttles a process so hard that its calls hang, so the limits sit well
# above that peak; the runaways they exist for reached 29-45 GB.
# Badger recovers a torn tail on open, and the wallet derives its coins again from its own
# rescan, so a kill costs a restart and nothing else.
[Service]
MemoryHigh=14G
MemoryMax=18G
MemorySwapMax=0
CPUQuota=200%
CPUWeight=50
Restart=always
RestartSec=10
TimeoutStopSec=30
