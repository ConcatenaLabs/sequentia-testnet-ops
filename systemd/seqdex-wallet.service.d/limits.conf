# The DEX wallet daemon (Ocean, seqdex-wallet.service) shares the box with the committee's
# nodes, the Arca operator and the makers. These limits keep a runaway from taking the box: it
# is slowed at 14 GB, killed and restarted at 18 GB, never pushed into swap, and held to two
# cores at half the default CPU weight. Its accounts scan the chain on their own, a few at a time
# while they catch up (OCEAN_SCAN_CATCHUP_PARALLEL, 4 by default), so the nodes, the Arca
# operator and the makers keep their share. Above MemoryHigh the kernel stalls the process
# until its calls hang, and with swap off it cannot reclaim the process's heap.
# The daemon's go.mod names Go 1.18, so the Go runtime neither sizes itself to the CPU quota nor
# collects before the kernel steps in: GOMAXPROCS matches the quota's two cores (with one thread
# per core of the box it was throttled in most periods), and GOMEMLIMIT sits under MemoryHigh, so
# the collector works harder before the kernel stalls the process.
# On SIGTERM the daemon ends its clients' notification streams, saves each account's scan height
# and closes its store within seconds; the stop timeout is room for that, not a wait.
[Service]
Environment=GOMAXPROCS=2 GOMEMLIMIT=12GiB
MemoryHigh=14G
MemoryMax=18G
MemorySwapMax=0
CPUQuota=200%
CPUWeight=50
Restart=always
RestartSec=10
TimeoutStopSec=90
