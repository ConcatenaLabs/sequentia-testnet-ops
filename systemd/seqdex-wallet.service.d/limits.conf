# The DEX wallet daemon (Ocean, seqdex-wallet.service) shares the box with the committee's
# nodes, the Arca operator and the makers. These limits keep a runaway from taking the box: it
# is slowed at 6 GB, killed and restarted at 8 GB, never pushed into swap, and held to three
# cores. Ocean holds about 3 GB while it scans its accounts after a start; above MemoryHigh the
# kernel throttles a process so hard that its calls hang, so the limit sits well above that.
# Badger recovers a torn tail on open, and the wallet derives its coins again from its own
# rescan, so a kill costs a restart and nothing else.
[Service]
MemoryHigh=6G
MemoryMax=8G
MemorySwapMax=0
CPUQuota=300%
Restart=always
RestartSec=10
TimeoutStopSec=30
