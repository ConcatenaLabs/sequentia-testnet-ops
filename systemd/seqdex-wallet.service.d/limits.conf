# The DEX wallet daemon (Ocean, seqdex-wallet.service) shares the box with the committee's
# nodes, the Arca operator and the makers. These limits keep a runaway from taking the box: it
# is killed and restarted at 18 GB, never pushed into swap, and held to two cores at half the
# default CPU weight. Its accounts scan the chain on their own, a few at a time while they catch
# up (OCEAN_SCAN_CATCHUP_PARALLEL, 4 by default), so the nodes, the Arca operator and the makers
# keep their share.
# There is no MemoryHigh: past it the kernel throttles the process instead of killing it, and with
# swap off it cannot reclaim the heap, so the daemon once sat throttled for hours, accepting
# connections and answering none. At MemoryMax the kernel kills it and Restart=always starts it
# again within seconds, which the journal and the health probe show.
# The daemon's go.mod names Go 1.18, so the Go runtime neither sizes itself to the CPU quota nor
# collects before a limit: GOMAXPROCS matches the quota's two cores (with one thread per core of
# the box it was throttled in most periods), and GOMEMLIMIT sits at three quarters of MemoryMax,
# so the collector works harder well before the kill.
# On SIGTERM the daemon ends its clients' notification streams, saves each account's scan height
# and closes its store within seconds; the stop timeout is room for that, not a wait.
[Service]
Environment=GOMAXPROCS=2 GOMEMLIMIT=13GiB
MemoryMax=18G
MemorySwapMax=0
CPUQuota=200%
CPUWeight=50
Restart=always
RestartSec=10
TimeoutStopSec=90
