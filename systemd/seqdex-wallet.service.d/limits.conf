# The DEX wallet daemon (Ocean, seqdex-wallet.service) shares the box with the committee's
# nodes, the Arca operator and the makers. A healthy Ocean stays well under a gigabyte (its
# badger stores are capped near 2.3 GB by their defaults). These limits keep a runaway from
# taking the box: it is slowed at 3 GB, killed and restarted at 4 GB, never pushed into swap,
# and held to three cores. Badger recovers a torn tail on open, and the wallet derives its coins
# again from its own rescan, so a kill costs a restart and nothing else.
[Service]
MemoryHigh=3G
MemoryMax=4G
MemorySwapMax=0
CPUQuota=300%
Restart=always
RestartSec=10
TimeoutStopSec=30
